<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="考心晴 · 基于 HarmonyOS NEXT 的考试焦虑智能调节助手">
  <title>考心晴 · 考试焦虑智能调节助手</title>
  <defs>
    <filter id="h-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="h-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="h-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#E9F2FF"/>
    </linearGradient>
    <style>
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
    </style>
  </defs>

  <rect x="5" y="5" width="990" height="420" rx="26" fill="url(#h-sky)" stroke="#2A3550" stroke-width="3.5" filter="url(#h-rough)"/>
  <rect x="5" y="5" width="990" height="420" rx="26" fill="#ffffff" filter="url(#h-paper)"/>

  <!-- soft breathing motif -->
  <g filter="url(#h-rough2)">
    <circle cx="170" cy="282" r="82" fill="none" stroke="#BFE8DA" stroke-width="3" stroke-dasharray="10 10"/>
    <circle cx="170" cy="282" r="62" fill="#EAF7EE" stroke="#2A3550" stroke-width="3.2"/>
    <circle cx="170" cy="282" r="44" fill="none" stroke="#8FE4DE" stroke-width="3"/>
    <path d="M170 254 c -8 -12 -26 -10 -26 4 c 0 12 18 20 26 32 c 8 -12 26 -20 26 -32 c 0 -14 -18 -16 -26 -4z" fill="#FF8B84" stroke="#2A3550" stroke-width="2.6"/>
  </g>

  <!-- sun -->
  <g stroke="#FFD76A" stroke-width="4" stroke-linecap="round" filter="url(#h-rough2)">
    <path d="M150 44 l 0 14 M150 146 l 0 -14 M99 95 l 14 0 M201 95 l -14 0 M114 59 l 11 11 M186 131 l -11 -11 M186 59 l -11 11 M114 131 l 11 -11"/>
  </g>
  <circle cx="150" cy="95" r="30" fill="#FFD76A" stroke="#2A3550" stroke-width="3.2" filter="url(#h-rough)"/>

  <!-- small plant -->
  <g filter="url(#h-rough2)">
    <path d="M64 360 q 6 -34 6 -44 h 40 q 0 12 6 44 z" fill="#FFE0B8" stroke="#2A3550" stroke-width="3"/>
    <path d="M90 316 q 0 -34 -18 -44 q -6 30 18 44z" fill="#34C759" stroke="#2A3550" stroke-width="2.6"/>
    <path d="M90 316 q 2 -30 22 -38 q 4 28 -22 38z" fill="#6BD98A" stroke="#2A3550" stroke-width="2.6"/>
  </g>

  <!-- title -->
  <g class="hw" filter="url(#h-rough2)">
    <text x="340" y="150" font-size="64" font-weight="700" fill="#2F80FF">考心晴</text>
    <text x="344" y="196" font-size="21" fill="#4A5872">考前的每一分不安，都被温柔接住</text>
    <path d="M344 208 q 150 8 300 0" fill="none" stroke="#38C8C1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- feature chips -->
  <g class="hw" filter="url(#h-rough2)">
    <g stroke="#2A3550" stroke-width="2.2">
      <rect x="344" y="224" width="104" height="38" rx="12" fill="#EAF4FF"/>
      <rect x="458" y="224" width="104" height="38" rx="12" fill="#EAF7EE"/>
      <rect x="572" y="224" width="150" height="38" rx="12" fill="#F1ECFF"/>
      <rect x="344" y="272" width="104" height="38" rx="12" fill="#FFF3E6"/>
      <rect x="458" y="272" width="104" height="38" rx="12" fill="#EAF4FF"/>
    </g>
    <text x="362" y="249" font-size="16" fill="#2A3550">考试倒计时</text>
    <text x="476" y="249" font-size="16" fill="#2A3550">压力测评</text>
    <text x="590" y="249" font-size="16" fill="#2A3550">CBT 认知调节</text>
    <text x="362" y="297" font-size="16" fill="#2A3550">呼吸训练</text>
    <text x="476" y="297" font-size="16" fill="#2A3550">心语陪伴</text>
  </g>

  <!-- countdown / stress card -->
  <g filter="url(#h-rough)">
    <rect x="748" y="104" width="208" height="180" rx="20" fill="#EAF4FF" stroke="#2A3550" stroke-width="3.2"/>
  </g>
  <g class="hw" filter="url(#h-rough2)">
    <text x="770" y="146" font-size="15" fill="#4A5872">距考试还有</text>
    <text x="766" y="210" font-size="52" font-weight="700" fill="#2F80FF">30</text>
    <text x="836" y="210" font-size="22" fill="#4A5872">天</text>
    <path d="M770 228 h 166" stroke="#2A3550" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="770" y="260" font-size="15" fill="#4A5872">压力指数</text>
    <text x="856" y="260" font-size="24" font-weight="700" fill="#FF8B84">38</text>
    <circle cx="936" cy="126" r="6" fill="#FF8B84"/>
  </g>

  <!-- chat bubble -->
  <g filter="url(#h-rough2)">
    <rect x="690" y="308" width="266" height="58" rx="14" fill="#FFF7E6" stroke="#2A3550" stroke-width="3"/>
    <path d="M706 366 l -14 16 3 -18z" fill="#FFF7E6" stroke="#2A3550" stroke-width="3"/>
    <text x="710" y="343" font-size="17" fill="#2F80FF" class="hw">听澜：别怕，我们一步一步来</text>
  </g>

  <!-- tiny doodles -->
  <g stroke="#F2C14E" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#h-rough2)">
    <path d="M300 330 q 14 -10 26 2" stroke="#38C8C1"/>
    <path d="M660 96 l 0 12 M654 102 l 12 0" stroke="#FFB3A7"/>
  </g>
</svg>
