<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="考试倒计时">
  <title>考试倒计时</title>
  <defs>
    <filter id="c-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="c-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="c-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <style>
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
      @keyframes c-tick { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .c-tick { transform-origin: 190px 210px; animation: c-tick 2s ease-in-out infinite; }
      @keyframes c-blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
      .c-blink { animation: c-blink 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#F7FAFF" stroke="#2A3550" stroke-width="3.4" filter="url(#c-rough)"/>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#fff" filter="url(#c-paper)"/>
  <rect x="34" y="12" width="86" height="26" rx="3" fill="#EAF4FF" stroke="#2A3550" stroke-width="2" transform="rotate(-6 77 25)" filter="url(#c-rough2)" opacity=".9"/>
  <g class="hw" filter="url(#c-rough2)">
    <text x="150" y="58" font-size="30" font-weight="700" fill="#2A3550">① 考试倒计时</text>
    <path d="M150 70 q 90 8 180 0" fill="none" stroke="#2F80FF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- calendar -->
  <g filter="url(#c-rough)">
    <rect x="96" y="120" width="188" height="160" rx="16" fill="#EAF4FF" stroke="#2A3550" stroke-width="3.6"/>
    <path d="M96 156 h 188" stroke="#2A3550" stroke-width="3.4"/>
    <circle cx="140" cy="106" r="8" fill="#FF8B84" stroke="#2A3550" stroke-width="2.6"/>
    <circle cx="240" cy="106" r="8" fill="#FF8B84" stroke="#2A3550" stroke-width="2.6"/>
  </g>
  <g class="c-tick" filter="url(#c-rough2)">
    <text x="128" y="238" font-size="66" font-weight="700" fill="#2F80FF" class="hw">30</text>
    <text x="238" y="236" font-size="24" fill="#4A5872" class="hw">天</text>
  </g>
  <g class="hw" filter="url(#c-rough2)">
    <text x="112" y="268" font-size="15" fill="#4A5872">距离 · 期末考试</text>
    <circle cx="316" cy="196" r="7" fill="#34C759" class="c-blink"/>
  </g>

  <!-- progress -->
  <g class="hw" filter="url(#c-rough2)">
    <text x="330" y="132" font-size="16" fill="#2A3550">今日计划</text>
    <g stroke="#2A3550" stroke-width="2.6" fill="#fff">
      <rect x="330" y="146" width="190" height="30" rx="10"/>
      <rect x="330" y="188" width="190" height="30" rx="10"/>
      <rect x="330" y="230" width="190" height="30" rx="10"/>
    </g>
    <path d="M344 161 l 7 7 13 -15" fill="none" stroke="#34C759" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M344 203 l 7 7 13 -15" fill="none" stroke="#34C759" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="352" cy="245" r="8" fill="none" stroke="#8A98AA" stroke-width="3"/>
    <text x="372" y="166" font-size="15" fill="#4A5872">真题 1 套</text>
    <text x="372" y="208" font-size="15" fill="#4A5872">错题复盘</text>
    <text x="372" y="250" font-size="15" fill="#4A5872">早睡 23:00</text>
  </g>

  <g stroke="#FFD76A" stroke-width="3.4" fill="none" stroke-linecap="round" filter="url(#c-rough2)">
    <path d="M58 300 q 18 10 36 0"/>
    <path d="M300 300 q 16 -12 30 2" stroke="#38C8C1"/>
  </g>
</svg>
