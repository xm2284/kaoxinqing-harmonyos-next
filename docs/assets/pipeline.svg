<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="听澜多 Agent 对话链路与双模式 AI">
  <title>听澜多 Agent 链路 · 双模式 AI</title>
  <defs>
    <filter id="p-rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="p-rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="18" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="p-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <style>
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
      @keyframes p-flow { to { stroke-dashoffset: -40; } }
      .p-flow { stroke-dasharray: 9 9; animation: p-flow 1.6s linear infinite; }
      @keyframes p-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .p-bob { animation: p-bob 3s ease-in-out infinite; }
      .p-bob.b2 { animation-delay: .5s; } .p-bob.b3 { animation-delay: 1s; } .p-bob.b4 { animation-delay: 1.5s; } .p-bob.b5 { animation-delay: 2s; }
    </style>
  </defs>
  <rect x="4" y="4" width="952" height="372" rx="24" fill="#F7FAFF" stroke="#2A3550" stroke-width="3.4" filter="url(#p-rough)"/>
  <rect x="4" y="4" width="952" height="372" rx="24" fill="#fff" filter="url(#p-paper)"/>
  <g class="hw" filter="url(#p-rough2)">
    <text x="40" y="56" font-size="28" font-weight="700" fill="#2A3550">听澜心语 · 多 Agent 链路</text>
    <path d="M40 68 q 110 8 220 0" fill="none" stroke="#38C8C1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- pipeline boxes -->
  <g class="p-bob" filter="url(#p-rough)"><rect x="40" y="110" width="150" height="76" rx="14" fill="#EAF7EE" stroke="#2A3550" stroke-width="3.2"/></g>
  <g class="p-bob b2" filter="url(#p-rough)"><rect x="220" y="110" width="150" height="76" rx="14" fill="#EAF4FF" stroke="#2A3550" stroke-width="3.2"/></g>
  <g class="p-bob b3" filter="url(#p-rough)"><rect x="400" y="110" width="150" height="76" rx="14" fill="#F1ECFF" stroke="#2A3550" stroke-width="3.2"/></g>
  <g class="p-bob b4" filter="url(#p-rough)"><rect x="580" y="110" width="150" height="76" rx="14" fill="#FFF3E6" stroke="#2A3550" stroke-width="3.2"/></g>
  <g class="p-bob b5" filter="url(#p-rough)"><rect x="760" y="110" width="160" height="76" rx="14" fill="#DFF3EA" stroke="#2A3550" stroke-width="3.2"/></g>
  <g class="hw" filter="url(#p-rough2)">
    <text x="60" y="146" font-size="17" font-weight="700" fill="#1E7A44">安全守门</text>
    <text x="60" y="170" font-size="13" fill="#2E5C43">高风险先保护</text>
    <text x="240" y="146" font-size="17" font-weight="700" fill="#2F62B0">听澜</text>
    <text x="240" y="170" font-size="13" fill="#41566E">共情倾听</text>
    <text x="420" y="146" font-size="17" font-weight="700" fill="#5B44B0">明镜</text>
    <text x="420" y="170" font-size="13" fill="#4A3A8A">识别认知偏差</text>
    <text x="600" y="146" font-size="17" font-weight="700" fill="#B4632A">拾光</text>
    <text x="600" y="170" font-size="13" fill="#5A4632">行动建议</text>
    <text x="780" y="146" font-size="17" font-weight="700" fill="#1E7A44">心语总控</text>
    <text x="780" y="170" font-size="13" fill="#2E5C43">汇总 · 收束回复</text>
  </g>
  <!-- arrows -->
  <g stroke="#38C8C1" stroke-width="3.4" fill="none" stroke-linecap="round" filter="url(#p-rough2)">
    <path class="p-flow" d="M190 148 h 30"/>
    <path class="p-flow" d="M370 148 h 30"/>
    <path class="p-flow" d="M550 148 h 30"/>
    <path class="p-flow" d="M730 148 h 30"/>
    <path d="M216 141 l 6 7 -6 7" stroke="#38C8C1"/>
    <path d="M396 141 l 6 7 -6 7" stroke="#38C8C1"/>
    <path d="M576 141 l 6 7 -6 7" stroke="#38C8C1"/>
    <path d="M756 141 l 6 7 -6 7" stroke="#38C8C1"/>
  </g>

  <!-- dual mode -->
  <g class="hw" filter="url(#p-rough2)">
    <rect x="40" y="232" width="420" height="112" rx="16" fill="#EAF4FF" stroke="#2A3550" stroke-width="3.2"/>
    <text x="62" y="268" font-size="19" font-weight="700" fill="#2F80FF">默认 · 本地 CBT 规则</text>
    <text x="62" y="296" font-size="14" fill="#41566E">无需联网、无需 Key，断网也能用</text>
    <text x="62" y="320" font-size="14" fill="#41566E">核心调节链路永远可用</text>

    <rect x="500" y="232" width="420" height="112" rx="16" fill="#F1ECFF" stroke="#2A3550" stroke-width="3.2"/>
    <text x="522" y="268" font-size="19" font-weight="700" fill="#5B44B0">可选 · DeepSeek 多 Agent</text>
    <text x="522" y="296" font-size="14" fill="#4A3A8A">配置 API Key 后自动升级为</text>
    <text x="522" y="320" font-size="14" fill="#4A3A8A">结构化多轮陪伴对话</text>
  </g>
</svg>
