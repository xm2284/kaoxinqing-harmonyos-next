<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="认知重构工坊">
  <title>认知重构工坊 · 三步挑战</title>
  <defs>
    <filter id="k-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="k-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="18" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="k-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <style>
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
      @keyframes k-flow { to { stroke-dashoffset: -40; } }
      .k-flow { stroke-dasharray: 8 8; animation: k-flow 1.6s linear infinite; }
    </style>
  </defs>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#F7FAFF" stroke="#2A3550" stroke-width="3.4" filter="url(#k-rough)"/>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#fff" filter="url(#k-paper)"/>
  <rect x="440" y="12" width="86" height="26" rx="3" fill="#FFF3E6" stroke="#2A3550" stroke-width="2" transform="rotate(5 483 25)" filter="url(#k-rough2)" opacity=".9"/>
  <g class="hw" filter="url(#k-rough2)">
    <text x="150" y="58" font-size="30" font-weight="700" fill="#2A3550">⑤ 认知重构工坊</text>
    <path d="M150 70 q 110 8 220 0" fill="none" stroke="#FF8B84" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- step boxes -->
  <g filter="url(#k-rough2)">
    <rect x="34" y="110" width="150" height="150" rx="16" fill="#FFF3E6" stroke="#2A3550" stroke-width="3.2"/>
    <rect x="205" y="110" width="150" height="150" rx="16" fill="#EAF4FF" stroke="#2A3550" stroke-width="3.2"/>
    <rect x="376" y="110" width="150" height="150" rx="16" fill="#EAF7EE" stroke="#2A3550" stroke-width="3.2"/>
  </g>
  <g class="hw" filter="url(#k-rough2)">
    <text x="52" y="142" font-size="15" font-weight="700" fill="#B4632A">① 自动想法</text>
    <text x="52" y="176" font-size="14" fill="#5A4632">「我肯定考不好」</text>
    <text x="52" y="200" font-size="14" fill="#5A4632">「来不及了」</text>
    <text x="52" y="224" font-size="14" fill="#5A4632">「别人都比我强」</text>

    <text x="223" y="142" font-size="15" font-weight="700" fill="#2F62B0">② 寻找证据</text>
    <text x="223" y="176" font-size="14" fill="#41566E">支持？反对？</text>
    <text x="223" y="200" font-size="14" fill="#41566E">我做过哪些</text>
    <text x="223" y="224" font-size="14" fill="#41566E">成功的题？</text>

    <text x="394" y="142" font-size="15" font-weight="700" fill="#1E7A44">③ 替代想法</text>
    <text x="394" y="176" font-size="14" fill="#2E5C43">「我已复习了</text>
    <text x="394" y="200" font-size="14" fill="#2E5C43">大部分重点」</text>
    <text x="394" y="224" font-size="14" fill="#2E5C43">「尽力就好」</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#38C8C1" stroke-width="3.4" fill="none" stroke-linecap="round" filter="url(#k-rough2)">
    <path class="k-flow" d="M184 185 h 21 M255 185 h -4"/>
    <path class="k-flow" d="M355 185 h 21 M426 185 h -4"/>
    <path d="M203 172 l 6 6 -6 6" stroke="#38C8C1"/>
    <path d="M374 172 l 6 6 -6 6" stroke="#38C8C1"/>
  </g>

  <g class="hw" filter="url(#k-rough2)">
    <path d="M34 292 q 220 14 492 0" fill="none" stroke="#FFD76A" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="322" font-size="15" fill="#4A5872">自动沉淀为成长记录 · 见证你的改变</text>
  </g>
</svg>
